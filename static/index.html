<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vishv - Movies, TV and Celebrities</title>
<style>
:root{--bg:#121212;--panel:#1f1f1f;--line:#2f2f2f;--text:#fff;--mute:#b3b3b3;--gold:#f5c518;--blue:#5799ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
header{background:#000;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:auto;display:flex;align-items:center;gap:14px;padding:8px 16px}
.logo{background:var(--gold);color:#000;font:900 26px/1 Arial Black,Impact,sans-serif;padding:6px 10px;border-radius:4px;cursor:pointer}
.search{flex:1;display:flex;position:relative}
.search input{flex:1;padding:10px 14px;border:0;border-radius:4px 0 0 4px;font-size:15px;background:#fff;color:#000;min-width:0}
.search button{border:0;background:#fff;padding:0 14px;border-radius:0 4px 4px 0;cursor:pointer;border-left:1px solid #ddd;font-size:16px}
nav{display:flex;gap:6px}
nav button{background:none;border:0;color:#fff;font-weight:600;padding:8px 10px;border-radius:4px;cursor:pointer;font-size:14px}
nav button:hover,nav button.on{background:#2a2a2a}
main{max-width:1280px;margin:auto;padding:0 16px 60px}
.hero{position:relative;height:420px;margin:16px 0;border-radius:6px;overflow:hidden;background:#000 center/cover;cursor:pointer}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 5%,rgba(0,0,0,.2) 70%),linear-gradient(0deg,#121212,transparent 40%)}
.hero div{position:absolute;z-index:2;left:32px;bottom:36px;max-width:520px}
.hero h1{margin:0 0 8px;font-size:40px;line-height:1.1}
.hero p{color:#ddd;margin:0 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
h2{font-size:24px;margin:34px 0 14px;padding-left:12px;border-left:4px solid var(--gold)}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.card{flex:0 0 170px;background:var(--panel);border-radius:6px;overflow:hidden;cursor:pointer;scroll-snap-align:start;border:1px solid var(--line)}
.card:hover{border-color:var(--gold)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#333}
.card .t{padding:8px 10px 12px}
.card .r{color:var(--gold);font-size:14px;font-weight:700}
.card .n{font-size:14px;line-height:1.3;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.grid .card{flex:auto}
.btn{background:var(--gold);color:#000;border:0;font-weight:700;padding:10px 18px;border-radius:20px;cursor:pointer;font-size:14px}
.btn.alt{background:#2a2a2a;color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;z-index:50;overflow:auto;padding:24px 12px}
#modal.open{display:block}
.sheet{max-width:960px;margin:auto;background:#181818;border-radius:8px;overflow:hidden;position:relative}
.x{position:absolute;right:12px;top:10px;z-index:3;background:#000a;color:#fff;border:0;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
.top{height:260px;background:#000 center/cover;position:relative}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#181818,transparent)}
.info{display:flex;gap:24px;padding:0 24px 24px;margin-top:-110px;position:relative;z-index:2}
.info img{width:200px;height:300px;object-fit:cover;border-radius:6px;flex:none;background:#333}
.meta{flex:1;padding-top:116px}
.meta h1{margin:0;font-size:34px;line-height:1.15}
.sub{color:var(--mute);margin:6px 0 10px}
.chips span{display:inline-block;border:1px solid #555;border-radius:16px;padding:2px 12px;margin:0 6px 6px 0;font-size:13px}
.scores{display:flex;gap:26px;margin:12px 0;flex-wrap:wrap}
.scores b{display:block;font-size:22px}
.scores small{color:var(--mute)}
.star{color:var(--gold)}
.body{padding:0 24px 28px}
.body h3{margin:22px 0 10px}
.cast{display:flex;gap:12px;overflow-x:auto}
.cast div{flex:0 0 100px;font-size:13px}
.cast img{width:100px;height:100px;object-fit:cover;border-radius:50%;background:#333;display:block;margin-bottom:4px}
.cast small{color:var(--mute);display:block}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:6px;background:#000}
.msg{padding:40px;text-align:center;color:var(--mute)}
@media(max-width:700px){nav{display:none}.hero{height:320px}.hero h1{font-size:28px}.info{flex-direction:column;align-items:flex-start;margin-top:-80px}.meta{padding-top:0}.info img{width:140px;height:210px}}
.fp{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin:16px 0}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.fp label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.fp input,.fp select{width:100%;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;padding:8px;font:inherit}
.gc{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.gc button{background:none;border:1px solid #555;color:#fff;border-radius:16px;padding:4px 14px;cursor:pointer}
.gc button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.card[data-rank]{position:relative}
.card[data-rank]::before{content:attr(data-rank);position:absolute;top:0;left:0;background:var(--gold);color:#000;font-weight:800;padding:2px 9px;border-radius:0 0 6px 0;z-index:2;font-size:14px}
.acc{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:10px 0}
.acc summary{padding:14px 18px;font-weight:700;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"\25BE";color:var(--mute)}
.acc[open] summary::after{content:"\25B4"}
.acc .in{padding:0 18px 18px}
.acc label,.sb label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.acc input,.acc select,.sb select{width:100%;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;padding:8px;font:inherit}
.sb select{width:auto}.sb label{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:16px 0}
.lr{display:flex;gap:16px;padding:14px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.lr:hover{background:#1a1a1a}
.lr img{width:90px;height:135px;object-fit:cover;border-radius:4px;background:#333;flex:none}
.lt{font-size:18px;font-weight:600}.ls{color:var(--mute);font-size:13px}
.lr p{margin:6px 0 0;color:#ccc;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{font-style:italic;color:#ddd;margin:6px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#181818;z-index:4}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:14px 14px;font:600 14px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.tabs button.on{color:#fff;border-color:var(--gold)}
.body p{line-height:1.7;font-size:16px;margin:0 0 12px}
.note{background:#222;border-left:3px solid var(--gold);padding:10px 14px;border-radius:4px;color:#ddd;margin:12px 0}
.facts{border-top:1px solid var(--line)}
.f{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.f span{color:var(--mute);font-weight:600}.f a{color:var(--blue)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.pc{font-size:13px}.pc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:#333;display:block;margin-bottom:4px}.pc small{color:var(--mute);display:block}
.cg h4{margin:16px 0 6px;color:var(--gold)}
.cr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #262626}.cr small{color:var(--mute);text-align:right}
.ep{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ep img{width:200px;height:113px;object-fit:cover;border-radius:4px;background:#333;flex:none}
.ep p{font-size:14px;color:#ccc;margin:6px 0 0}
.vl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.vl button{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.vl button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.gal.po{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.gal img{width:100%;border-radius:4px;display:block;background:#333}
.rvw{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:12px 16px}
.rvw summary{cursor:pointer;list-style:none}.rvw summary small{color:var(--mute);margin-left:6px}
.rvw .pv{color:#ccc;margin-top:6px;font-size:14px}.rvw[open] .pv{display:none}
.rvw .rt{margin-top:10px}
@media(max-width:700px){.f{grid-template-columns:1fr;gap:2px}.ep{flex-direction:column}.ep img{width:100%;height:auto;aspect-ratio:16/9}.tabs{padding:0 8px}}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:40px;max-width:380px;width:100%}
.login-box h2{margin:0 0 24px;text-align:center;font-size:28px}
.login-box input{width:100%;padding:10px 12px;margin-bottom:12px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:6px;font:inherit}
.login-box .btn{width:100%;margin-top:4px}
.login-box .err{color:#f44;font-size:13px;margin-top:8px;text-align:center}
.user-info{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);white-space:nowrap}
.user-info b{color:var(--gold)}
.user-info button{background:none;border:1px solid #555;color:#fff;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:13px}
.user-info button:hover{border-color:var(--gold)}
.side-by-side{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:16px}
@media(max-width:700px){.side-by-side{grid-template-columns:1fr}}
.side-col h2{border-left:0;padding-left:0;margin:0 0 12px;font-size:20px}
.side-col:first-child h3{background:#1a2a1a;border-left:3px solid #4caf50;padding:6px 12px;border-radius:4px}
.side-col:last-child h3{background:#2a1a2a;border-left:3px solid #e040fb;padding:6px 12px;border-radius:4px}
.um-list{margin:10px 0}
.um-row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.um-row .role{color:var(--gold);font-size:12px;text-transform:uppercase;margin-left:8px}
.um-row button{background:#c62828;color:#fff;border:0;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:13px}
.um-form{display:flex;gap:8px;margin-top:12px}
.um-form input{flex:1;padding:8px;background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;font:inherit}
.cmp-bar{display:flex;align-items:center;gap:12px;margin:16px 0;padding:12px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.cmp-bar select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;padding:6px 10px;font:inherit}
.sub-tabs{display:flex;gap:8px;margin:16px 0 20px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sub-tabs button{background:#222;border:1px solid #444;color:var(--mute);padding:8px 18px;border-radius:20px;cursor:pointer;font-weight:600;font-size:14px}
.sub-tabs button:hover{color:#fff;border-color:#666}
.sub-tabs button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.settings-section{margin-bottom:24px;background:#222;padding:18px;border-radius:8px;border:1px solid var(--line)}
.settings-section h3{margin:0 0 12px;font-size:16px;color:var(--gold)}
.settings-section input{width:100%;padding:10px;margin-bottom:10px;background:#181818;color:#fff;border:1px solid #444;border-radius:4px;font:inherit}
.blend-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:20px 0 12px;padding:14px 18px;background:linear-gradient(90deg,#20142b,#151c28);border:1px solid #3c2a52;border-radius:8px}
.blend-header h2{margin:0;border:0;padding:0;font-size:22px;color:var(--gold)}
.blend-header button{background:#332544;border:1px solid #6c4b8e;color:#fff;padding:6px 14px;border-radius:16px;cursor:pointer;font-size:13px}
.blend-header button:hover{background:#4b3366}
.sug-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);color:var(--gold);font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px;border:1px solid #443210}
.list-head-bar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.list-head-bar h2{margin:0;border:0;padding:0;font-size:22px}
.list-head-bar button{background:#2a2a2a;border:1px solid #444;color:#fff;padding:5px 12px;border-radius:14px;cursor:pointer;font-size:13px}
.list-head-bar button:hover{border-color:var(--gold)}
.filter-pills{display:flex;gap:8px;margin:12px 0 18px}
.filter-pills button{background:#1c1c1c;border:1px solid #333;color:var(--mute);padding:6px 14px;border-radius:16px;cursor:pointer;font-size:13px}
.filter-pills button.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}

.story{position:relative}
.story p{margin:0 0 10px}
.story.clamp .stext{display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;color:var(--gold);cursor:pointer;padding:4px 0;font:inherit;font-weight:700}
.ytlink{display:inline-block;margin-top:8px;color:var(--gold);font-size:14px}
.card.wl{position:relative}
.done{position:absolute;top:8px;right:8px;z-index:3;width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:#000a;color:transparent;font-size:18px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.done:hover{background:var(--gold);border-color:var(--gold);color:#000}
.card.gone{opacity:0;transform:scale(.92);transition:.3s}

/* search suggestions */
.sug{position:absolute;top:100%;left:0;right:0;background:#1f1f1f;border:1px solid var(--line);border-top:0;border-radius:0 0 4px 4px;z-index:40;max-height:70vh;overflow:auto;display:none;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.sg{display:flex;gap:12px;align-items:center;padding:8px 12px;cursor:pointer;border-bottom:1px solid #2a2a2a}
.sg:last-child{border-bottom:0}
.sg:hover,.sg.on{background:#2c2c2c}
.sg img{width:38px;height:56px;object-fit:cover;border-radius:3px;background:#333;flex:none}
.sgt{font-weight:600;line-height:1.3}
.sg small{color:var(--mute)}
/* My List: categories and nations (Wishlist and Watched views) */
.gx-hint{color:var(--mute);font-size:13px;margin:4px 0 14px}
.cat{margin:18px 0 26px;padding:14px;background:#171717;border:1px solid var(--line);border-radius:8px}
.cat-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:20px;font-weight:700;border-left:4px solid var(--gold);padding-left:12px;margin-bottom:14px}
.cat-h small{color:var(--mute);font-size:14px;font-weight:400}
.cat-empty{color:var(--mute);padding:18px 4px}
.cat-sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:400;color:var(--mute)}
.cat-sort select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;padding:6px 10px;font:inherit}
.card[draggable="true"]{cursor:grab}
.card[draggable="true"] img{-webkit-user-drag:none;user-select:none}
.card .ty{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.card.dragging{opacity:.35}
.card.drop-before{box-shadow:-5px 0 0 var(--gold)}
.card.drop-after{box-shadow:5px 0 0 var(--gold)}
.cat.drop-on{outline:2px dashed var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" onclick="home()">Vishv</div>
  <form class="search" onsubmit="return doSearch(event)">
    <input id="q" placeholder="Search Vishv" autocomplete="off" oninput="onType()"><button aria-label="Search">&#128269;</button>
    <div id="sug" class="sug" role="listbox"></div>
  </form>
  <nav>
    <button class="on" data-v="home" onclick="nav('home')">Home</button>
    <button data-v="top" onclick="nav('top')">Top 250</button>
    <button data-v="movies" onclick="nav('movies')">Movies</button>
    <button data-v="tv" onclick="nav('tv')">TV Shows</button>
    <button data-v="filter" onclick="nav('filter')">Filter</button>
    <button data-v="mine" onclick="nav('mine')">My List</button>
  </nav>
  <div class="user-info" id="user-info"></div>
</div></header>
<main id="app"></main>
<div id="modal" onclick="if(event.target===this)closeM()"><div class="sheet" id="sheet"></div></div>

<script>
const T="https://api.themoviedb.org/3", IMG="https://image.tmdb.org/t/p/";
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const _tc={};
async function tmdb(path,params=""){
  const k=path+params,now=Date.now();
  if(_tc[k]&&now-_tc[k].t<300000) return _tc[k].d;
  const r=await fetch(`/api/tmdb${path}?language=en-US${params}`);
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error("TMDB error "+r.status+(j.error?" - "+j.error:j.status_message?" - "+j.status_message:""))}
  const d=await r.json(); _tc[k]={t:now,d}; return d;
}
async function omdb(imdbId){
  if(!imdbId) return null;
  try{const r=await fetch(`/api/omdb?i=${imdbId}`);const d=await r.json();return d.Response==="True"?d:null}catch{return null}
}

let ME=null;
async function checkAuth(){
  try{const r=await fetch("/api/me");if(r.ok){ME=await r.json();onLogin();return}}catch{}
  showLogin();
}
function showLogin(){
  document.querySelector("header").style.display="none";
  app.innerHTML=`<div class="login-wrap"><div class="login-box">
    <h2>🎬 Vishv</h2>
    <input id="lu" placeholder="Username" autocomplete="username">
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">Log in</button>
    <div class="err" id="lerr"></div>
  </div></div>`;
  document.getElementById("lu").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("lp").focus()});
  document.getElementById("lp").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
}
async function doLogin(){
  const u=$("#lu").value.trim(),p=$("#lp").value;
  if(!u||!p){$("#lerr").textContent="Enter username and password";return}
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
  if(!r.ok){$("#lerr").textContent="Invalid credentials";return}
  ME=await r.json(); onLogin();
}
function onLogin(){
  document.querySelector("header").style.display="";
  $("#user-info").innerHTML=`<b>${esc(ME.username)}</b><button onclick="accountSettings()">⚙️ Settings</button>`;
  home();
}
async function doLogout(){
  await fetch("/api/logout",{method:"POST"});
  ME=null; $("#user-info").innerHTML=""; showLogin();
}

function card(it,type){
  const t=it.media_type||type||"movie";
  if(t==="person") return "";
  const name=it.title||it.name, yr=(it.release_date||it.first_air_date||"").slice(0,4);
  const img=it.poster_path?`${IMG}w342${it.poster_path}`:"";
  return `<div class="card" onclick="openM('${t}',${it.id})">
    <img loading="lazy" src="${img}" alt="${esc(name)}">
    <div class="t"><div class="r">&#9733; ${it.vote_average?it.vote_average.toFixed(1):"N/A"}</div>
    <div class="n">${esc(name)}</div><small style="color:var(--mute)">${yr}</small></div></div>`;
}
const rowOf=(title,items,type)=>`<h2>${title}</h2><div class="row">${items.map(i=>card(i,type)).join("")}</div>`;

async function home(){
  nav("home",true);
  app.innerHTML='<div id="home-hero"></div><div id="home-rows"></div>';
  const rowsBox=$("#home-rows");
  const addRow=(title,items,type)=>{if(rowsBox) rowsBox.insertAdjacentHTML("beforeend",rowOf(title,items,type))};

  tmdb("/trending/all/week").then(tr=>{
    const h=tr.results.find(x=>x.backdrop_path)||tr.results[0];
    const heroBox=$("#home-hero");

/* ---------- Live search: results refresh on every keystroke, suggestions under the bar ---------- */
let SEARCH_TOK=0, SUG_TOK=0, SEARCH_ACTIVE=false, SEARCH_TIMER=null, SUG_ITEMS=[], SUG_SEL=-1;
function hideSug(){
  const b=$("#sug"); if(b) b.style.display="none";
  SUG_SEL=-1; document.querySelectorAll("#sug .sg").forEach(x=>x.classList.remove("on"));
}
function showSug(items){
  const b=$("#sug"); if(!b) return;
  SUG_ITEMS=items; SUG_SEL=-1;
  if(!items.length){b.innerHTML="";b.style.display="none";return}
  b.innerHTML=items.map((it,i)=>{
    const yr=(it.release_date||it.first_air_date||"").slice(0,4);
    return `<div class="sg" role="option" data-i="${i}" onmousedown="event.preventDefault()" onclick="pickSug(${i})"><img src="${it.poster_path?IMG+"w92"+it.poster_path:""}" alt=""><div><div class="sgt">${esc(it.title||it.name)}</div><small>${[yr,it.media_type==="tv"?"TV series":"Movie"].filter(Boolean).join(" &middot; ")}</small></div></div>`}).join("");
  b.style.display="block";
}
function pickSug(i){const it=SUG_ITEMS[i]; if(!it) return; hideSug(); openM(it.media_type,it.id)}
function moveSug(d){
  const els=[...document.querySelectorAll("#sug .sg")]; if(!els.length) return;
  SUG_SEL=SUG_SEL<0?(d>0?0:els.length-1):(SUG_SEL+d+els.length)%els.length;
  els.forEach((x,i)=>x.classList.toggle("on",i===SUG_SEL));
  els[SUG_SEL].scrollIntoView({block:"nearest"});
}
function onType(){
  // Typing only refreshes the suggestions under the bar. The full results page is shown on Enter or the search button.
  const q=$("#q").value.trim(), tok=++SUG_TOK;
  if(!q){hideSug(); if(SEARCH_ACTIVE) home(); return}   // box cleared while on a results page: back to Home
  suggest(q,tok);
}
async function suggest(q,tok){
  try{
    const d=await tmdb("/search/multi","&include_adult=false&query="+encodeURIComponent(q));
    if(tok!==SUG_TOK) return;   // a newer keystroke (or Enter) took over
    showSug(d.results.filter(r=>r.media_type!=="person"&&r.poster_path).slice(0,6));
  }catch{ if(tok===SUG_TOK) hideSug() }
}
async function runSearch(q,closeSug){
  const tok=++SEARCH_TOK;
  if(!SEARCH_ACTIVE){
    document.querySelectorAll("nav button").forEach(b=>b.classList.remove("on"));
    app.innerHTML='<div class="msg">Searching...</div>';
  }
  SEARCH_ACTIVE=true;
  try{
    const d=await tmdb("/search/multi","&include_adult=false&query="+encodeURIComponent(q));
    if(tok!==SEARCH_TOK) return;
    const items=d.results.filter(r=>r.media_type!=="person"&&r.poster_path);
    const people=d.results.filter(r=>r.media_type==="person").slice(0,6);
    app.innerHTML=`<h2>Results for "${esc(q)}"</h2>`+(items.length?`<div class="grid">${items.map(i=>card(i)).join("")}</div>`:'<div class="msg">No titles found. Try another spelling.</div>')
      +(people.length?`<h2>People</h2><div class="cast">${people.map(p=>`<div><img src="${p.profile_path?IMG+"w185"+p.profile_path:""}" alt=""><b>${esc(p.name)}</b><small>${esc(p.known_for_department||"")}</small></div>`).join("")}</div>`:"");
    hideSug();
  }catch(err){
    if(tok!==SEARCH_TOK) return;
    app.innerHTML=`<div class="msg">${esc(err.message)}</div>`; hideSug();
  }
}
function doSearch(e){
  e.preventDefault();
  const q=$("#q").value.trim(); if(!q) return false;
  SUG_TOK++; hideSug();   // cancel any suggestion request still in flight
  runSearch(q,true);
  return false;
}

const money=n=>n?"$"+Number(n).toLocaleString("en-US"):"";
const hm=m=>m?(m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`):"";
const na=v=>v&&v!=="N/A"?v:"";
const fact=(k,v)=>v?`<div class="f"><span>${k}</span><div>${v}</div></div>`:"";
const paras=t=>String(t||"").split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("");

      else{const r=d.content_ratings.results;const c=r.find(x=>x.iso_3166_1==="IN")||r.find(x=>x.iso_3166_1==="US");cert=c&&c.rating||cert}
    }catch{}
    const rt=(o.Ratings||[]).find(r=>r.Source==="Rotten Tomatoes");
    const imdbR=na(o.imdbRating)?`${o.imdbRating}<small>/10 &middot; ${esc(o.imdbVotes)} votes</small>`:null;
    const sub=[yr,cert,hm(mins),type==="tv"&&d.number_of_seasons?`${d.number_of_seasons} season${d.number_of_seasons>1?"s":""} &middot; ${d.number_of_episodes} episodes`:"",d.status].filter(Boolean).join("  |  ");

          <div><small>TMDB rating</small><b>&#9733; ${d.vote_average?d.vote_average.toFixed(1):"N/A"}<small>/10 &middot; ${(d.vote_count||0).toLocaleString()} votes</small></b></div>
          ${rt?`<div><small>Rotten Tomatoes</small><b>${esc(rt.Value)}</b></div>`:""}
          ${na(o.Metascore)?`<div><small>Metascore</small><b>${esc(o.Metascore)}</b></div>`:""}
        </div></div></div>

const ytEmbed=(k,extra="")=>`<iframe ${extra} src="https://www.youtube.com/embed/${k}?rel=0&playsinline=1" title="Video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe><br><a class="ytlink" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${k}">&#9654; Open on YouTube</a>`;

// Longer story: combines TMDB overview, OMDb full plot and season summaries (~7-9 lines)
function buildStory(){
  const {type,d,o}=CUR;
  const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  const parts=[];
  const add=t=>{t=String(t||"").trim();if(!t)return;const n=norm(t);if(!n)return;
    if(parts.some(p=>norm(p).includes(n.slice(0,60))||n.includes(norm(p).slice(0,60))))return;parts.push(t)};
  const full=na(o.Plot), ov=d.overview||"";
  if(full&&full.length>ov.length){add(full);add(ov)}else{add(ov);add(full)}
  if(type==="tv"){
    (d.seasons||[]).filter(s=>s.season_number>0&&s.overview).forEach(s=>{
      if(parts.join(" ").length<900) add(`Season ${s.season_number}: ${s.overview}`)});
  }
  return parts.join("\n");
}

  const writers=jobs(["Writer","Screenplay","Story","Novel","Author"])||na(o.Writer);
  const stars=(d.credits.cast||[]).slice(0,6).map(c=>c.name).join(", ");

  const wtxt=[prov("Stream",reg.flatrate),prov("Rent",reg.rent),prov("Buy",reg.buy)].filter(Boolean).join("<br>");
  const full=na(o.Plot);

  const showFull=full&&full.length>story.length*0.6&&full.slice(0,60)!==story.slice(0,60);

    ${coll?`<p class="note">Part of the <b>${esc(coll.name)}</b></p>`:""}
    <h3>Details</h3><div class="facts">

      ${fact("Box office",esc(na(o.BoxOffice)))}

/* Card rating: your own rating if you gave one, otherwise the public TMDB rating (kept for 7 days in this browser) */
let TRATE={};
try{TRATE=JSON.parse(localStorage.getItem("vishv_trate")||"{}")}catch{}
const TRATE_TTL=7*864e5, trKey=x=>`${x.media_type}_${x.tmdb_id}`;
function ratingHTML(x){
  if(x.rating) return "&#9733; "+x.rating+"/10";
  const t=TRATE[trKey(x)];
  return t&&t.r?`&#9733; ${t.r.toFixed(1)}/10 <small style="color:var(--mute);font-weight:400">TMDB</small>`:"Not rated";
}
async function fillRatings(items){
  const need=items.filter(x=>!x.rating&&!(TRATE[trKey(x)]&&Date.now()-TRATE[trKey(x)].t<TRATE_TTL));
  let i=0, dirty=false;
  const worker=async()=>{
    while(i<need.length){
      const x=need[i++];
      try{
        const d=await tmdb(`/${x.media_type}/${x.tmdb_id}`);
        TRATE[trKey(x)]={r:d.vote_average||0,t:Date.now()}; dirty=true;
        document.querySelectorAll(`[data-rk="${trKey(x)}"]`).forEach(el=>{el.innerHTML=ratingHTML(x)});
      }catch{}
    }
  };
  await Promise.all(Array.from({length:Math.min(6,need.length)},worker));
  if(dirty) try{localStorage.setItem("vishv_trate",JSON.stringify(TRATE))}catch{}
}
const mcard=x=>{const mine=ME&&MINE_VIEW==="user_"+ME.username, todo=mine&&x.watchlist&&!x.watched;
  return `<div class="card ${todo?"wl":""}" onclick="openM('${x.media_type}',${x.tmdb_id})">${todo?`<button class="done" title="Mark as watched" onclick="event.stopPropagation();markDone('${x.media_type}',${x.tmdb_id},this)">&#10003;</button>`:""}<img loading="lazy" src="${x.poster?IMG+"w342"+x.poster:""}" alt=""><div class="t"><div class="r" data-rk="${x.media_type}_${x.tmdb_id}">${ratingHTML(x)}</div><div class="n">${esc(x.title)}</div></div></div>`};

  setTimeout(()=>{CURRENT_DISPLAY_DATA=MINE_DATA;renderFilteredList()},300);

/* ---------- Wishlist / Watched: Girls' Love, Boys' Love, Normal, with nation sorting by drag and drop ---------- */
const LCATS=[["gl","Girls' Love"],["bl","Boys' Love"],["normal","Normal Movies and Series"]];
const LCAT_RE={
  bl:/boys'?\s?love|^bl$|yaoi|gay (romance|relationship)/i,
  gl:/girls'?\s?love|^gl$|^yuri$|lesbian (romance|relationship)/i};
let LAYOUTS={}, DETECTED={}, GTOK=0, GCTX=null, DRAG=null, SAVING=false, SAVE_AGAIN=false;
const lkey=x=>`${x.media_type}_${x.tmdb_id}`;
function nationName(c){
  if(!c||c==="ZZ") return "Unknown nation";
  try{return new Intl.DisplayNames(["en"],{type:"region"}).of(c)||c}catch{return c}
}
async function ensureLayout(user){
  if(LAYOUTS[user]) return LAYOUTS[user];
  try{
    const r=await fetch("/api/layout/"+encodeURIComponent(user));
    if(r.ok){const j=await r.json(); return LAYOUTS[user]={items:j.items||{},nations:j.nations||{}}}
  }catch{}
  // Could not load: show the list, but never save over what is stored on the server.
  return {items:{},nations:{},_nosave:true};
}
async function detectOne(x){
  const d=await tmdb(`/${x.media_type}/${x.tmdb_id}`,"&append_to_response=keywords");
  const kw=d.keywords||{};
  const names=((x.media_type==="tv"?kw.results:kw.keywords)||[]).map(k=>k.name||"");
  const nb=names.filter(k=>LCAT_RE.bl.test(k)).length, ng=names.filter(k=>LCAT_RE.gl.test(k)).length;
  const c=(nb||ng)?(ng>nb?"gl":"bl"):"normal";
  let n=String((d.origin_country||[])[0]||((d.production_countries||[])[0]||{}).iso_3166_1||"ZZ").toUpperCase();
  if(!/^[A-Z]{2,8}$/.test(n)) n="ZZ";
  return {c,n};
}
async function detectMissing(need,onProgress){
  let i=0,done=0;
  const worker=async()=>{
    while(i<need.length){
      const x=need[i++];
      try{DETECTED[lkey(x)]=await detectOne(x)}catch{}   // failed ones are retried next time
      onProgress(++done,need.length);
    }
  };
  await Promise.all(Array.from({length:Math.min(6,need.length)},worker));
}
const metaOf=(L,x)=>L.items[lkey(x)]||DETECTED[lkey(x)]||{c:"normal",n:"ZZ"};
let CATNAT={gl:"",bl:"",normal:""};   // nation chosen in each category's Sort by menu ("" = all nations)
function buildCats(items,L){
  const by={gl:[],bl:[],normal:[]};
  items.forEach((x,i)=>{
    const m=metaOf(L,x), c=by[m.c]?m.c:"normal";
    by[c].push({x,i,p:typeof m.p==="number"?m.p:1e9,n:m.n||"ZZ"});
  });
  const out={};
  for(const [cat] of LCATS){
    const list=by[cat].sort((a,b)=>a.p-b.p||a.i-b.i), counts={};
    list.forEach(o=>{counts[o.n]=(counts[o.n]||0)+1});
    const nations=Object.keys(counts).sort((a,b)=>nationName(a).localeCompare(nationName(b)));
    if(CATNAT[cat]&&!counts[CATNAT[cat]]) CATNAT[cat]="";
    out[cat]={all:list.map(o=>o.x),shown:list.filter(o=>!CATNAT[cat]||o.n===CATNAT[cat]).map(o=>o.x),nations,counts};
  }
  return out;
}
function setCatNation(cat,v){CATNAT[cat]=v;renderFilteredList()}
function gridCard(x,edit){
  let h=mcard(x).replace(/<\/div><\/div><\/div>\s*$/,`</div><small class="ty">${x.media_type==="tv"?"Series":"Movie"}</small></div></div>`);
  if(edit) h=h.replace('<div class="card','<div data-k="'+lkey(x)+'" draggable="true" class="card').replace('<img loading="lazy"','<img draggable="false" loading="lazy"');
  return h;
}
function catBlock(cat,label,c,edit){
  if(!c.all.length&&!edit) return "";
  const sel=c.nations.length?`<label class="cat-sort">Sort by nation <select onchange="setCatNation('${cat}',this.value)"><option value="">All nations (${c.all.length})</option>${c.nations.map(n=>`<option value="${esc(n)}" ${CATNAT[cat]===n?"selected":""}>${esc(nationName(n))} (${c.counts[n]})</option>`).join("")}</select></label>`:"";
  return `<section class="cat" data-cat="${cat}"><div class="cat-h"><span>${esc(label)}</span><small>${CATNAT[cat]?c.shown.length+" of "+c.all.length:c.all.length}</small>${sel}</div>`
    +(c.shown.length?`<div class="grid">${c.shown.map(x=>gridCard(x,edit)).join("")}</div>`
      :`<div class="cat-empty">Nothing here yet.${edit?" Drag a title here to move it into this category.":""}</div>`)
    +`</section>`;
}
async function renderGrouped(listArea,items,title,emptyMsg){
  const tok=++GTOK;
  if(!items.length){listArea.innerHTML=`<div class="msg">${emptyMsg}</div>`;return}
  const user=MINE_VIEW.replace("user_",""), isMe=user===ME.username;
  const stale=()=>tok!==GTOK||!listArea.isConnected;
  const hadList=!!listArea.querySelector(".cat");   // keep the current list on screen while refreshing
  if(!LAYOUTS[user]&&!hadList) listArea.innerHTML='<div class="msg">Loading...</div>';
  const L=await ensureLayout(user); if(stale()) return;
  const need=items.filter(x=>!L.items[lkey(x)]&&!DETECTED[lkey(x)]);
  if(need.length){
    if(!hadList) listArea.innerHTML=`<div class="msg">Sorting titles into categories (0 of ${need.length})...</div>`;
    await detectMissing(need,(d,t)=>{if(!hadList&&!stale()) listArea.innerHTML=`<div class="msg">Sorting titles into categories (${d} of ${t})...</div>`});
    if(stale()) return;
    if(isMe){
      let ch=false;
      items.forEach(x=>{const k=lkey(x); if(!L.items[k]&&DETECTED[k]){L.items[k]={c:DETECTED[k].c,n:DETECTED[k].n};ch=true}});
      if(ch) saveLayout(L);
    }
  }
  GCTX={user,isMe,items};
  const G=buildCats(items,L);
  listArea.dataset.edit=isMe?"1":"0";
  listArea.innerHTML=`<h3>${title} (${items.length})</h3>`
    +(isMe?'<div class="gx-hint">Drag a title to change its order, or drop it into another category. Use Sort by nation in each category to choose which nation to show. <span id="g-stat"></span></div>':"")
    +LCATS.map(([cat,label])=>catBlock(cat,label,G[cat],isMe)).join("");
}
async function saveLayout(L){
  if(L._nosave) return;
  if(SAVING){SAVE_AGAIN=true;return}
  SAVING=true; let ok=true;
  try{
    do{
      SAVE_AGAIN=false;
      const r=await fetch("/api/layout",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items:L.items,nations:L.nations})});
      if(!r.ok) ok=false;
    }while(SAVE_AGAIN);
  }catch{ok=false}
  SAVING=false;
  const st=$("#g-stat"); if(st) st.textContent=ok?"":"Could not save the arrangement. Check the connection and try again.";
}
function applyDrop(d,t){
  const ctx=GCTX; if(!ctx||!ctx.isMe) return;
  const L=LAYOUTS[ctx.user]; if(!L) return;
  const G=buildCats(ctx.items,L);
  const item=ctx.items.find(x=>lkey(x)===d.key); if(!item) return;
  const cat=t.cat;
  const list=G[cat].all.filter(x=>lkey(x)!==d.key);
  let idx=list.length;
  if(t.type==="card"){const ti=list.findIndex(x=>lkey(x)===t.key); if(ti>=0) idx=ti+(t.after?1:0)}
  list.splice(idx,0,item);
  list.forEach((x,i)=>{const k=lkey(x); const m=L.items[k]||(L.items[k]={...metaOf(L,x)}); m.c=cat; m.p=i});
  if(CATNAT[cat]&&CATNAT[cat]!==metaOf(L,item).n) CATNAT[cat]="";   // keep the moved title visible
  saveLayout(L);
  renderFilteredList();
}
const tEl=e=>e.target&&(e.target.nodeType===1?e.target:e.target.parentElement);
const editArea=el=>{const a=el&&el.closest("#user-items-area");return a&&a.dataset.edit==="1"?a:null};
function dropTarget(el,e){
  const c=el.closest("[data-k]");
  if(c){
    if(c.dataset.k===DRAG.key) return null;
    const r=c.getBoundingClientRect();
    return {type:"card",el:c,cat:c.closest(".cat").dataset.cat,key:c.dataset.k,after:e.clientX>r.left+r.width/2};
  }
  const cs=el.closest(".cat"); if(cs) return {type:"cat",el:cs,cat:cs.dataset.cat};
  return null;
}
function clearMarks(){document.querySelectorAll(".drop-before,.drop-after,.drop-on").forEach(x=>x.classList.remove("drop-before","drop-after","drop-on"))}
function endDrag(){DRAG=null;document.querySelectorAll(".card.dragging").forEach(x=>x.classList.remove("dragging"))}
document.addEventListener("dragstart",e=>{
  const el=tEl(e); if(!editArea(el)) return;
  const card=el.closest("[data-k]");
  if(card){DRAG={kind:"card",key:card.dataset.k};card.classList.add("dragging")}
  else return;
  e.dataTransfer.effectAllowed="move";
  try{e.dataTransfer.setData("text/plain",DRAG.kind)}catch{}
});
document.addEventListener("dragover",e=>{
  if(!DRAG) return;
  const el=tEl(e); if(!editArea(el)) return;
  clearMarks();
  const t=dropTarget(el,e); if(!t) return;
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  if(t.type==="card") t.el.classList.add(t.after?"drop-after":"drop-before");
  else t.el.classList.add("drop-on");
});
document.addEventListener("dragleave",e=>{
  const r=e.relatedTarget;
  if(!r||!r.closest||!r.closest("#user-items-area")) clearMarks();
});
document.addEventListener("drop",e=>{
  if(!DRAG) return;
  const el=tEl(e); if(!editArea(el)) return;
  e.preventDefault();
  const t=dropTarget(el,e), d=DRAG;
  clearMarks(); endDrag();
  if(t) applyDrop(d,t);
});
document.addEventListener("dragend",()=>{clearMarks();endDrag()});

/* ---------- Keep My List up to date: after every change, when you return to the tab, and every 20 seconds ---------- */
let LAST_SYNC=0;
async function syncList(force){
  if(!ME) return;
  const onBlend=MINE_VIEW==="blend"&&!!$("#mine-content");
  if(!onBlend&&(!MINE_VIEW.startsWith("user_")||!$("#user-items-area"))) return;
  if(!force&&(DRAG||document.hidden||document.querySelector("#modal.open")||Date.now()-LAST_SYNC<3000)) return;
  LAST_SYNC=Date.now();
  const view=MINE_VIEW, u=view.slice(5);
  try{
    if(onBlend){   // Blended Suggestions is built from your list, so redraw it when your list changed
      const mine=await my("");
      if(!Array.isArray(mine)||MINE_VIEW!==view) return;
      const changed=JSON.stringify(mine)!==JSON.stringify(MINE_DATA);
      MINE_DATA=mine;
      if(changed) renderMineContent();
      return;
    }
    const data=u===ME.username?await my(""):await fetch(`/api/my/user/${encodeURIComponent(u)}`).then(r=>r.json());
    if(!Array.isArray(data)||MINE_VIEW!==view) return;
    if(u===ME.username) MINE_DATA=data; else OTHER_DATA[u]=data;
    if(JSON.stringify(data)===JSON.stringify(CURRENT_DISPLAY_DATA)) return;   // nothing changed
    CURRENT_DISPLAY_DATA=data;
    renderFilteredList();
  }catch{}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden) syncList()});
window.addEventListener("focus",()=>syncList());
setInterval(()=>syncList(),20000);

async function loadBlend(friendName){
  const box=$("#blend-results-area"); if(!box) return;
  box.innerHTML='<div class="msg">Brewing blended suggestions from both taste profiles...</div>';
  
  const friendData=await fetch(`/api/my/user/${encodeURIComponent(friendName)}`).then(r=>r.json());
  OTHER_DATA[friendName]=friendData;
  const myData=MINE_DATA||[];

  // 1. All titles either of us watched or put on watchlist
  const watchedOrSaved=new Set([
    ...myData.map(x=>`${x.media_type}_${x.tmdb_id}`),
    ...friendData.map(x=>`${x.media_type}_${x.tmdb_id}`)
  ]);

  // 2. Titles that user or friend liked (watched and rated >= 6, or watched)
  const myLiked=myData.filter(x=>x.watched&&(x.rating===null||x.rating>=6));
  const friendLiked=friendData.filter(x=>x.watched&&(x.rating===null||x.rating>=6));
  const seeds=[...myLiked, ...friendLiked];

  // If no watched titles, fallback to any saved titles
  const seedPool=seeds.length?seeds:[...myData, ...friendData];

  if(!seedPool.length){
    // Fallback: top trending items not seen
    try{
      const tr=await tmdb("/trending/all/week");
      const filtered=tr.results.filter(x=>!watchedOrSaved.has(`${x.media_type||'movie'}_${x.id}`));
      box.innerHTML=`<h3>🔥 Trending for You Both</h3><div class="grid">${filtered.slice(0,18).map(i=>card(i)).join("")}</div>`;
    }catch(e){
      box.innerHTML='<div class="msg">Could not load suggestions right now.</div>';
    }
    return;
  }

  // Pick up to 4 diverse seed titles from each person
  const sampleSeeds=seedPool.sort(()=>0.5-Math.random()).slice(0,4);
  const recJobs=sampleSeeds.map(s=>
    tmdb(`/${s.media_type}/${s.tmdb_id}/recommendations`).then(res=>(res.results||[]).map(r=>({...r,media_type:s.media_type,seed_title:s.title}))).catch(()=>[])
  );

  const resultsLists=await Promise.all(recJobs);
  const candidateMap=new Map();

  for(const list of resultsLists){
    for(const item of list){
      const key=`${item.media_type||'movie'}_${item.id}`;
      if(watchedOrSaved.has(key)) continue; // Never show anything either person watched or saved!
      if(!item.poster_path) continue;
      if(!candidateMap.has(key)){
        candidateMap.set(key,{item,score:item.vote_average||5,reasons:[item.seed_title]});
      } else {
        const existing=candidateMap.get(key);
        existing.score+=2; // Boost if recommended by multiple titles
        if(!existing.reasons.includes(item.seed_title)) existing.reasons.push(item.seed_title);
      }
    }
  }

  let finalRecs=[...candidateMap.values()].sort((a,b)=>b.score-a.score).slice(0,24);

  if(!finalRecs.length){
    // If TMDB recs exhausted, discover popular titles not watched
    const pop=await tmdb("/movie/top_rated");
    const popTv=await tmdb("/tv/top_rated");
    const merged=[...pop.results.map(x=>({...x,media_type:'movie'})), ...popTv.results.map(x=>({...x,media_type:'tv'}))];
    const filtered=merged.filter(x=>!watchedOrSaved.has(`${x.media_type}_${x.id}`)&&x.poster_path).slice(0,18);
    box.innerHTML=`<h3>🌟 Highly-Rated Hidden Gems (Neither has watched)</h3><div class="grid">${filtered.map(i=>card(i)).join("")}</div>`;
    return;
  }

  box.innerHTML=`
    <div style="margin-bottom:14px;color:var(--mute)">Showing top picks matching both of your tastes (None of which either of you has watched or saved):</div>
    <div class="grid">${finalRecs.map(r=>card(r.item,r.item.media_type)).join("")}</div>
  `;
}
const TYPES=[["movie","Movies"],["tv","TV series"]];
const LANGS=[["","Any"],["en","English"],["hi","Hindi"],["ta","Tamil"],["te","Telugu"],["ml","Malayalam"],["kn","Kannada"],["bn","Bengali"],["mr","Marathi"],["pa","Punjabi"],["ko","Korean"],["ja","Japanese"],["th","Thai"],["zh","Chinese"],["fr","French"],["es","Spanish"],["de","German"],["it","Italian"]];
const COUNTRIES=[["","Any"],["IN","India"],["US","United States"],["GB","United Kingdom"],["KR","South Korea"],["JP","Japan"],["TH","Thailand"],["CN","China"],["TW","Taiwan"],["FR","France"],["ES","Spain"],["DE","Germany"]];
const SORTS=[["pop","Popularity"],["title","Alphabetical"],["rating","User rating"],["votes","Number of votes"],["date","Release date"]];
const SORTMAP={pop:["popularity","popularity"],title:["title","name"],rating:["vote_average","vote_average"],votes:["vote_count","vote_count"],date:["primary_release_date","first_air_date"]};
const KEYF={pop:x=>x.popularity||0,title:x=>(x.title||x.name||"").toLowerCase(),rating:x=>x.vote_average||0,votes:x=>x.vote_count||0,date:x=>x.release_date||x.first_air_date||"",rank:x=>-(x._rank||0)};
const TV_ALIAS={"Action":"Action & Adventure","Adventure":"Action & Adventure","Science Fiction":"Sci-Fi & Fantasy","Fantasy":"Sci-Fi & Fantasy","War":"War & Politics"};
const CATS={
  bl:{label:"BL (Boys' Love)",q:["boys love","bl","yaoi","gay romance","gay relationship"],re:/boys'?\s?love|^bl$|yaoi|gay (romance|relationship)/i},
  gl:{label:"GL (Girls' Love)",q:["girls love","yuri","lesbian romance","lesbian relationship"],re:/girls'?\s?love|yuri|lesbian (romance|relationship)/i}};
let GEN=null, KW={}, FS={}, TP={types:["movie"],cat:"all",sort:"rank",dir:"desc",n:0};

const opt=a=>a.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join("");
const chip=(on,fn,t)=>`<button type="button" class="${on?"on":""}" onclick="${fn}">${t}</button>`;
function togType(S,t,redraw){S.types=S.types.includes(t)?S.types.filter(x=>x!==t):[...S.types,t];if(!S.types.length)S.types=[t];redraw()}
async function loadGenres(){
  if(GEN) return;
  const [m,t]=await Promise.all([tmdb("/genre/movie/list"),tmdb("/genre/tv/list")]);
  const hide=new Set(Object.values(TV_ALIAS));
  GEN={movie:m.genres,tv:t.genres,names:[...new Set([...m.genres,...t.genres].map(g=>g.name))].filter(n=>!hide.has(n)).sort()};
}
function typeHasGenre(type,n){return !!GEN[type].find(x=>x.name===(type==="tv"?(TV_ALIAS[n]||n):n))}
// Only genres that exist for every currently selected title type - keeps a genre
// from silently dropping one type (e.g. "Romance" has no TV equivalent on TMDB).
function genresFor(types){return GEN.names.filter(n=>types.every(t=>typeHasGenre(t,n)))}
function genreIds(type,names){
  const out=new Set();
  for(const n of names){
    const g=GEN[type].find(x=>x.name===(type==="tv"?(TV_ALIAS[n]||n):n));
    if(!g) return null;  // this type has no such genre
    out.add(g.id);
  }
  return [...out];
}
async function kwIds(c){
  if(KW[c]) return KW[c];
  const d=CATS[c];
  const res=await Promise.all(d.q.map(q=>tmdb("/search/keyword","&query="+encodeURIComponent(q)).catch(()=>({results:[]}))));
  return KW[c]=[...new Set(res.flatMap(r=>r.results||[]).filter(k=>d.re.test(k.name)).map(k=>k.id))];
}
function buildParams(type,o){
  const d=type==="tv"?"first_air_date":"primary_release_date";
  const ids=genreIds(type,o.genres||[]); if(!ids) return null;
  if(o.romance&&type==="movie") ids.push(10749);
  let p="&include_adult=false";
  if(ids.length) p+="&with_genres="+ids.join(",");
  if(o.d1) p+=`&${d}.gte=${o.d1}`;
  if(o.d2) p+=`&${d}.lte=${o.d2}`;
  if(o.r1) p+="&vote_average.gte="+o.r1;
  if(o.r2) p+="&vote_average.lte="+o.r2;
  if(o.v1) p+="&vote_count.gte="+o.v1;
  if(o.v2) p+="&vote_count.lte="+o.v2;
  if(o.rt1) p+="&with_runtime.gte="+o.rt1;
  if(o.rt2) p+="&with_runtime.lte="+o.rt2;
  if(o.lang) p+="&with_original_language="+o.lang;
  if(o.country) p+="&with_origin_country="+o.country;
  if(o.kw&&o.kw.length) p+="&with_keywords="+o.kw.join(o.kwOr?"|":",");
  if(o.kwExclude&&o.kwExclude.length) p+="&without_keywords="+o.kwExclude.join("|");
  return p;
}
function sortItems(a,key,dir){const f=KEYF[key];return a.sort((x,y)=>{const A=f(x),B=f(y);return(A<B?-1:A>B?1:0)*(dir==="asc"?1:-1)})}
// Fetch from every selected type, merge and sort. span = how many pages per type.
async function fetchSet(types,o,key,dir,page,span=1){
  let err=null; const jobs=[];
  for(const t of types){
    const p=buildParams(t,o); if(p===null) continue;
    const f=SORTMAP[key][t==="tv"?1:0];
    for(let i=0;i<span;i++) jobs.push(tmdb("/discover/"+t,`${p}&sort_by=${f}.${dir}&page=${page+i}`).then(r=>({t,r})).catch(e=>{err=err||e;return null}));
  }
  const res=(await Promise.all(jobs)).filter(Boolean);
  if(!res.length&&err) throw err;
  const tot={}, pg={};
  res.forEach(({t,r})=>{tot[t]=r.total_results||0;pg[t]=r.total_pages||0});
  const items=res.flatMap(({t,r})=>r.results.map(x=>({...x,media_type:t})));
  return{items:sortItems(items,key,dir),total:Object.values(tot).reduce((a,b)=>a+b,0),pages:Math.max(0,...Object.values(pg))};
}
const row=(it,n)=>{const t=it.media_type||"movie",yr=(it.release_date||it.first_air_date||"").slice(0,4);
  return `<div class="lr" onclick="openM('${t}',${it.id})"><img loading="lazy" src="${it.poster_path?IMG+"w185"+it.poster_path:""}" alt=""><div><div class="lt">${n}. ${esc(it.title||it.name)}</div><div class="ls">${yr} &middot; ${t==="tv"?"TV series":"Movie"}</div><div><span class="star">&#9733;</span> ${it.vote_average?it.vote_average.toFixed(1):"N/A"} <small style="color:var(--mute)">(${(it.vote_count||0).toLocaleString()})</small></div><p>${esc(it.overview||"")}</p></div></div>`};

async function runFilter(more){
  const v=id=>$("#"+id).value.trim(), box=$("#fres");
  if(more) FS.page++; else {FS.page=1;FS.count=0;box.innerHTML='<div class="msg">Searching...</div>'}
  try{

      const o={genres:FS.genres,d1:v("f-d1"),d2:v("f-d2"),r1:v("f-r1"),r2:v("f-r2"),v1:v("f-v1"),v2:v("f-v2"),rt1:v("f-t1"),rt2:v("f-t2"),lang:v("f-l"),country:v("f-c"),kw:[]};

}

    </div>`:''}

    <div class="settings-section" style="border-color:#5a2020;background:#1e1414">

async function saveUsername(){
  const msg=$("#set-user-msg"); msg.textContent="";
  const newName=$("#set-new-user").value.trim();
  if(!newName){msg.style.color="#f44";msg.textContent="Username cannot be empty";return}
  const r=await fetch("/api/change-username",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username:newName})
  });
  const data=await r.json();
  if(!r.ok){
    msg.style.color="#f44";
    msg.textContent=data.error||"Failed to update username";
  } else {
    ME.username=newName;
    $("#user-info b").textContent=newName;
    msg.style.color="#4caf50";
    msg.textContent="Username updated successfully!";
  }
}

async function savePassword(){
  const msg=$("#set-pass-msg"); msg.textContent="";
  const newPass=$("#set-new-pass").value.trim();
  if(!newPass){msg.style.color="#f44";msg.textContent="Password cannot be empty";return}
  const r=await fetch("/api/change-password",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({password:newPass})
  });
  const data=await r.json();
  if(!r.ok){
    msg.style.color="#f44";
    msg.textContent=data.error||"Failed to update password";
  } else {
    $("#set-new-pass").value="";
    msg.style.color="#4caf50";
    msg.textContent="Password updated successfully!";
  }
}

$("#q").addEventListener("keydown",e=>{
  const open=$("#sug").style.display==="block";
  if(e.key==="ArrowDown"&&open){e.preventDefault();moveSug(1)}
  else if(e.key==="ArrowUp"&&open){e.preventDefault();moveSug(-1)}
  else if(e.key==="Escape"){hideSug()}
  else if(e.key==="Enter"&&open&&SUG_SEL>=0){e.preventDefault();pickSug(SUG_SEL)}
});
$("#q").addEventListener("focus",()=>{if(SUG_ITEMS.length&&$("#q").value.trim()) $("#sug").style.display="block"});
document.addEventListener("click",e=>{if(!e.target.closest||!e.target.closest(".search")) hideSug()});

checkAuth();
</script>
